aid: qwilr
name: Qwilr
description: >-
  Qwilr is a document-experience platform for creating interactive, web-based
  sales proposals, quotes, contracts, and reports that replace static PDFs.
  Beyond the editor, Qwilr exposes a REST API (https://api.qwilr.com/v1) and a
  hosted, OAuth-protected Model Context Protocol (MCP) server that let teams
  generate branded pages from templates and reusable saved blocks, manage quote
  tax definitions and Qwilr Pay payment gateways, subscribe to page-lifecycle
  webhook events (viewed, accepted, set-live), and automate the sales workflow
  programmatically. API access is an Enterprise capability authenticated with
  bearer JWT access tokens. Qwilr is backed by Point Nine and maintains a public
  trust portal with SOC 2 Type 2, PCI DSS, and GDPR posture.
